name: Build SpawnerShop

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test
        run: mvn --batch-mode --errors verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: SpawnerShop
          path: target/SpawnerShop.jar
          if-no-files-found: error
          retention-days: 30
